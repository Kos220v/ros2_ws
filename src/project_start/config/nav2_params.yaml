controller_server:
  ros__parameters:
    use_sim_time: False
    controller_plugins: ["MPPIController"]
    MPPIController:
      ...
      # Настройки для объезда препятствий
      motion_model: "DiffDrive"
      ...

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true