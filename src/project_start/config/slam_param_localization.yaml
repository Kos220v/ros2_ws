# ============================================================================
# Вариант slam_param.yaml (лежит в корне workspace) для РЕЖИМА ЛОКАЛИЗАЦИИ
# по уже построенной карте, вместо построения новой карты с нуля.
#
# Использование:
#   1. Сначала постройте карту в режиме mapping (обычный slam_param.yaml),
#      проедьте по территории, затем сохраните карту — либо кнопкой
#      "Сохранить карту" в desktop-приложении, либо вручную:
#        ros2 service call /slam_toolbox/serialize_map \
#          slam_toolbox/srv/SerializePoseGraph "{filename: '/home/pi/ros2_ws/maps/map'}"
#   2. Скопируйте ЭТОТ файл в корень workspace рядом с slam_param.yaml,
#      поправьте map_file_name на реальный путь к сохранённой карте.
#   3. Запустите:
#        ros2 launch slam_toolbox localization_launch.py \
#          slam_params_file:=/home/pi/ros2_ws/slam_param_localization.yaml
#
# В desktop-приложении это делает кнопка "Режим локализации" на странице SLAM.
# ============================================================================
slam_toolbox:
  ros__parameters:
    scan_topic: /scan_reliable
    odom_frame: odom
    map_frame: map
    base_frame: base_link

    mode: localization

    # ОБЯЗАТЕЛЬНО поправьте на путь к вашей сохранённой карте (БЕЗ расширения —
    # slam_toolbox сам добавит .posegraph/.data), см. пункт 1 выше.
    map_file_name: /home/pi/ros2_ws/maps/map

    # Начальная поза робота на карте (x, y, yaw в радианах). Если не знаете —
    # оставьте нули и подвиньте робота вручную в RViz (2D Pose Estimate) после запуска.
    map_start_pose: [0.0, 0.0, 0.0]

    use_odometry: true
    use_scan_matching: true
    use_scan_barycenter: false

    resolution: 0.02
    max_laser_range: 12.0
    minimum_time_interval: 0.01
    transform_publish_period: 0.01

    minimum_travel_distance: 0.01
    minimum_travel_heading: 0.02

    correlation_search_space_dimension: 3.0
    correlation_search_space_resolution: 0.05
    correlation_search_space_smear_deviation: 0.03

    angular_search_space_dimension: 6.2832
    angular_search_space_resolution: 0.01745

    use_response_expansion: true
    match_window_size: 15
    match_search_size: 15
    match_response_threshold: 0.55
    minimum_score_threshold: 0.45
