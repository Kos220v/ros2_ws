navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0

    # Фреймы: для снятия смещения GPS-антенны относительно центра робота
    # navsat_transform_node ищет трансформацию map -> base_link
    # (map -> odom публикует EKF с publish_tf: true, odom -> base_link — odom_node).
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link

    magnetic_declination_radians: 0.20944   # 12.0° * pi/180 (Нижний Новгород)
    yaw_offset: 0.0
    zero_altitude: true
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false        # datum передаётся из launch (home_latitude/longitude)
    broadcast_utm_transform: false
