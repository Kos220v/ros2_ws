# ============================================================================
# navsat_transform_node — превращает GPS-координаты (широта/долгота) в
# локальную декартову одометрию (/odometry/gps), которую фьюзит ekf_global.yaml.
#
# ЭТОГО УЗЛА РАНЬШЕ НЕ БЫЛО В ПРОЕКТЕ ВООБЩЕ — GPS не участвовал в
# локализации никак (только в отдельном расчёте "расстояние до дома" внутри
# robot_commander). Это главная причина, почему в описании проекта GPS
# упоминается, а фактически на курс робота не влиял.
# ============================================================================
navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0

    # ОБЯЗАТЕЛЬНО настройте под своё местоположение!
    # Магнитное склонение (разница между истинным и магнитным севером) в
    # радианах. Найдите своё значение, например, на
    # https://www.magnetic-declination.com/ (в градусах) и переведите в
    # радианы: rad = deg * pi / 180.
    # Пример: Москва ≈ +11.6° -> 0.2025 рад.
    magnetic_declination_radians: 0.0

    # compass_node (см. compass_control) публикует yaw=0, когда робот смотрит
    # на СЕВЕР (магнитный). navsat_transform ожидает yaw=0 по ВОСТОКУ (ENU),
    # поэтому нужен сдвиг на 90° = pi/2. Смотрите комментарий в
    # dual_ekf_navsat_example.yaml (эталонный пример) — тот же принцип.
    yaw_offset: 1.570796327

    zero_altitude: true          # альтитуда GPS зашумлена и не нужна 2D-роботу
    broadcast_utm_transform: false
    publish_filtered_gps: true   # удобно для отладки в rviz (топик /gps/filtered)
    use_odometry_yaw: false      # курс берём из imu0 (компас), не из одометрии
    wait_for_datum: false        # точка отсчёта (0,0) берётся из первого фикса GPS
