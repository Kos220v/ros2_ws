# ============================================================================
# КАЛИБРОВКА МАГНИТОМЕТРА
#
# Это свойство КОНКРЕТНОГО РОБОТА, а не местности. Значения не меняются при
# переезде на другой полигон — в отличие от магнитного склонения, которое
# задаётся аргументом запуска declination_deg.
#
# Пока здесь нули, курс робота врёт на десятки градусов, причём по-разному
# в разные стороны. Уличная навигация в таком виде работать не будет.
#
# КАК ЗАПОЛНИТЬ (два шага, порядок важен)
# ---------------------------------------
# Шаг 1 — смещение нуля и масштаб осей:
#
#     ros2 run robot_navigation mag_calibrator
#     # медленно вращайте робота 2-3 оборота вокруг вертикальной оси
#     # утилита напечатает hard_iron_* и soft_iron_scale_*
#
# Шаг 2 — угол монтажа платы (ТОЛЬКО ПОСЛЕ шага 1):
#
#     # перезапустите робота с новыми значениями из шага 1, затем:
#     ros2 run robot_navigation heading_check \
#         --ros-args -p true_azimuth_deg:=210
#     # где 210 — реальный азимут носа робота по компасу телефона
#
# Шаг 3 — обязательная перепроверка:
#
#     # разверните робота на 90° и повторите heading_check с новым азимутом
#     # курс должен сойтись И в этом положении тоже
#
# Почему порядок важен: пока магнитометр не откалиброван, ошибка курса
# МЕНЯЕТСЯ при повороте робота. Подобрав угол монтажа на некалиброванном
# датчике, вы подгоните робота под одно направление, а во всех остальных
# он будет врать по-прежнему.
#
# КАЛИБРОВАТЬ НАДО ЗАНОВО, ЕСЛИ:
#   * переставили плату магнитометра;
#   * изменили разводку силовых проводов рядом с ней;
#   * поставили другой аккумулятор или моторы.
# ============================================================================

mag_declination_node:
  ros__parameters:

    # --- Шаг 1: смещение нуля (hard iron), ТЕСЛА -----------------------------
    # Постоянное магнитное поле самого робота: рама, аккумулятор, магниты
    # моторов. Именно оно обычно и даёт основную ошибку курса.
    # Типичные значения — единицы и десятки микротесла, то есть e-06 ... e-05.
    hard_iron_x: 0.0
    hard_iron_y: 0.0
    hard_iron_z: 0.0

    # --- Шаг 1: масштаб осей (soft iron), безразмерный ----------------------
    # Выравнивает чувствительность осей: железо рядом с датчиком искажает
    # поле неодинаково, и «шар» измерений становится эллипсом.
    # Значения обычно в пределах 0.8 ... 1.2.
    soft_iron_scale_x: 1.0
    soft_iron_scale_y: 1.0
    soft_iron_scale_z: 1.0

    # --- Шаг 2: угол монтажа платы, ГРАДУСЫ ---------------------------------
    # Поворот осей магнитометра относительно осей робота.
    # Чаще всего оказывается кратен 90°, но может быть и произвольным.
    #
    # ЭТО НЕ МАГНИТНОЕ СКЛОНЕНИЕ. Склонение задаётся отдельно, аргументом
    # запуска declination_deg, потому что зависит от места, а не от робота.
    mounting_yaw_deg: 0.0
