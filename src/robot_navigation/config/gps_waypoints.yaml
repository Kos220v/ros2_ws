# ============================================================================
# МАРШРУТ ИЗ GPS-ТОЧЕК
#
# Формат:
#   latitude   широта, градусы  (обязательно)
#   longitude  долгота, градусы (обязательно)
#   yaw        желаемый курс в точке, радианы ENU (необязательно)
#              0 = на восток, 1.57 = на север, 3.14 = на запад, -1.57 = на юг.
#              В конфиге Nav2 допуск по курсу намеренно снят
#              (yaw_goal_tolerance: 3.14), поэтому поле почти всегда можно
#              не заполнять — робот не будет тратить время на разворот
#              в каждой точке.
#
# КАК ПОЛУЧИТЬ КООРДИНАТЫ
# -----------------------
# Правильный способ — записать их приёмником САМОГО робота:
#
#   ros2 run robot_navigation gps_waypoint_logger \
#       --ros-args -p output_file:=/home/pi/route.yaml
#   # катаем робота пультом, в нужных местах:
#   ros2 service call /gps_waypoint_logger/log_waypoint std_srvs/srv/Trigger
#
# Так систематическая ошибка приёмника взаимно сокращается, и робот проезжает
# маршрут заметно точнее, чем по координатам, снятым с онлайн-карты
# (снимки в картографических сервисах смещены относительно реальности
# на единицы метров).
#
# СКОЛЬКО СТАВИТЬ ТОЧЕК
# ---------------------
# Ставьте точку каждые 5-20 метров и обязательно на каждом повороте.
# Расстояние между соседними точками должно быть заметно меньше половины
# скользящего глобального костмапа (окно 120×120 м в nav2_params.yaml,
# робот в центре → до края ~60 м). Иначе планировщик не увидит цель
# и вернёт GOAL_OUTSIDE_MAP. gps_waypoint_commander проверяет интервалы
# при загрузке файла и предупредит, если точки слишком далеко или близко.
#
# ТОЧНОСТЬ
# --------
# Бытовой GNSS без RTK даёт 2.5-5 м. В nav2_params.yaml допуск прибытия
# xy_goal_tolerance выставлен в 1.5 м с учётом того, что EKF сглаживает фикс
# одометрией и IMU. Не занижайте его — робот начнёт бесконечно «доводиться»
# и крутиться на месте.
#
# Файл специально оставлен пустым: образец с чужими координатами опасен —
# робот уедет не туда. Запишите свой маршрут логгером или впишите точки ниже.
# ============================================================================

waypoints: []
