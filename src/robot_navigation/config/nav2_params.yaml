# ============================================================================
# NAV2 — конфигурация для УЛИЧНОЙ навигации гусеничного робота по GNSS.
#
# Отличия от стандартного nav2_params.yaml (и почему):
#
#  1. НЕТ amcl и НЕТ map_server. Глобальную локализацию (map -> odom) даёт
#     ekf_filter_node_map из robot_localization, а карты местности у нас нет.
#  2. НЕТ static_layer в обоих костмапах — по той же причине.
#  3. global_costmap сделан ROLLING (скользящим). На улице маршрут может быть
#     длиной в километры, и держать его целиком в одном костмапе нереально по
#     памяти. Скользящее окно 60x60 м всегда содержит робота и ближайшую точку
#     маршрута. Ставьте окно заведомо больше расстояния между соседними точками.
#  4. Контроллер — Regulated Pure Pursuit, а НЕ MPPI. MPPI просчитывает 2000
#     траекторий 20 раз в секунду и полностью загрузит Raspberry Pi 4. RPP
#     почти не ест CPU, а для езды по точкам на улице ведёт себя предсказуемо
#     и плавно.
#  5. Источник препятствий — /scan_reliable (лидар через relay_reliable),
#     inf_is_valid: true, потому что на улице лидар часто «не видит» ничего и
#     отдаёт бесконечность — эти лучи нужно считать свободным пространством.
#
# ГЕОМЕТРИЯ РОБОТА: колея 0.48 м -> радиус описанной окружности ~0.45 м.
# Если размеры вашего шасси другие — правьте robot_radius в ОБОИХ костмапах.
# ============================================================================

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # 20 Гц штатно; если Pi4 не тянет — снижайте до 10 Гц.
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Робот обязан проехать 0.5 м за 15 с, иначе считаем, что он застрял
      # (на траве/гравии разгон медленнее, чем в помещении, поэтому 15 с).
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Допуск прибытия. Бытовой GNSS без RTK даёт 2.5-5 м, поэтому требовать
      # точность 0.25 м, как в помещении, бессмысленно — робот будет вечно
      # «доводиться» и крутиться на месте.
      xy_goal_tolerance: 1.5
      # Курс в точке маршрута нам не важен — берём максимально мягкий допуск,
      # иначе робот будет разворачиваться на месте в каждой точке.
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- скорости -------------------------------------------------------
      desired_linear_vel: 0.6          # крейсерская скорость, м/с
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 1.0

      # --- точка погони (lookahead) ---------------------------------------
      # Чем дальше точка, тем плавнее и «ленивее» едет робот; чем ближе —
      # тем точнее держит траекторию, но начинает рыскать.
      lookahead_dist: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 2.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      # --- регулировка скорости -------------------------------------------
      # Сбрасывать скорость на крутых поворотах — критично для гусеничного
      # робота, который в повороте проскальзывает.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # Сбрасывать скорость рядом с препятствиями.
      use_cost_regulated_linear_velocity_scaling: true

      # --- повороты на месте -----------------------------------------------
      # Гусеничный робот умеет разворачиваться на месте — пользуемся этим,
      # когда путь уходит сильно вбок.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6      # рад (~34°)
      rotate_to_heading_angular_vel: 0.8    # рад/с
      max_angular_accel: 2.0

      # Задний ход запрещён: сзади нет ни лидара, ни камеры — ехать вслепую
      # по улице опасно.
      allow_reversing: false

      # --- проверка столкновений -------------------------------------------
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      max_robot_pose_search_dist: 10.0
      transform_tolerance: 0.2
      stateful: true

# ---------------------------------------------------------------- ЛОКАЛЬНЫЙ КОСТМАП
# Небольшое окно вокруг робота во фрейме odom (гладком, без GPS-скачков).
# Именно по нему контроллер объезжает препятствия.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.45
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_reliable
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          # На улице лучи часто уходят «в никуда» и возвращают inf.
          # Без этого флага такие лучи не очищают костмап, и робот
          # обрастает призрачными препятствиями.
          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Радиус раздувания = радиус робота + запас безопасности.
        inflation_radius: 0.85

      always_send_full_costmap: True

# ---------------------------------------------------------------- ГЛОБАЛЬНЫЙ КОСТМАП
# Скользящее окно 60x60 м во фрейме map. Разрешение грубее локального (0.1 м),
# чтобы планировщик успевал считать путь на Pi4.
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.45
      resolution: 0.1

      rolling_window: True
      width: 60
      height: 60

      # Неизвестное пространство считаем проходимым: карты у нас нет, и если
      # запретить ехать в неизвестность, планировщик не найдёт ни одного пути.
      track_unknown_space: false

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_reliable
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.85

      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # Допуск планировщика: если точная цель занята препятствием, принять
      # путь, заканчивающийся в пределах 1 м от неё.
      tolerance: 1.0
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    # false — если одна точка недостижима, робот не бросает маршрут,
    # а едет к следующей. Для уличного патрулирования это правильнее.
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      # Пауза в каждой точке, миллисекунды. Даёт GNSS устояться перед
      # расчётом курса на следующую точку.
      waypoint_pause_duration: 2000

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # [vx, vy, wz] — vy = 0, робот дифференциальный (гусеничный)
    max_velocity: [0.6, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    # Плавный разгон бережёт трансмиссию и не даёт гусеницам сорваться в юз.
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: "/odometry/local"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
