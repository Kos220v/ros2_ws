# ============================================================================
# imu_filter_madgwick — слияние MPU6050 (гироскоп + акселерометр) и
# магнитометра QMC5883L/HMC5883L в АБСОЛЮТНУЮ ориентацию.
#
# Вход:  /imu/data_raw (sensor_msgs/Imu без ориентации, от mpu6050_control)
#        /imu/mag      (sensor_msgs/MagneticField, от mag_declination_node)
# Выход: /imu/data     (sensor_msgs/Imu с полем orientation)
#
# Именно этот узел заменяет самописное слияние компаса и гироскопа: гироскоп
# даёт быструю динамику поворота, магнитометр убирает дрейф, а фильтр Маджвика
# корректно объединяет их без «залипания» и без скачков через ±180°.
# ============================================================================
imu_filter_madgwick:
  ros__parameters:
    # ENU (East-North-Up) — соглашение REP-103, которого требует
    # robot_localization и Nav2. 0° = восток, +90° = север.
    # Значение по умолчанию у пакета — устаревшее "nwu", его обязательно менять.
    world_frame: "enu"

    # Использовать магнитометр. Без него курс будет уплывать по гироскопу
    # и уличная навигация работать не будет.
    use_mag: true

    # Подписываться на sensor_msgs/MagneticField (а не устаревший Vector3Stamped).
    use_magnetic_field_msg: true

    # TF не публикуем: ориентацию робота публикуют EKF-узлы, а два источника
    # одного трансформа сломают TF-дерево.
    publish_tf: false

    # Коэффициент фильтра: больше — быстрее сходится, но шумнее.
    # 0.1 — значение по умолчанию, хорошо работает на подвижном шасси.
    # Если курс дёргается от вибрации гусениц — уменьшите до 0.05.
    gain: 0.1

    # Оценка дрейфа гироскопа (рад/с). Ненулевое значение позволяет фильтру
    # самому вычитать смещение нуля гироскопа MPU6050, которое плывёт от нагрева.
    zeta: 0.02

    # dt считаем по меткам времени сообщений (0.0 = динамически).
    constant_dt: 0.0

    # Гравитацию НЕ вычитаем: robot_localization сам её убирает
    # (imu0_remove_gravitational_acceleration: true).
    remove_gravity_vector: false

    # Не публиковать безынерционную оценку (только для отладки).
    stateless: false

    # --- Калибровка магнитометра (hard-iron), в теслах ------------------------
    # ВАЖНО: оставьте нули ЗДЕСЬ, если калибруете в compass_control
    # (параметры mag_hard_iron_x/y/z в LSB). Дублировать поправку в двух местах
    # нельзя. Порядок калибровки описан в README пакета.
    mag_bias_x: 0.0
    mag_bias_y: 0.0
    mag_bias_z: 0.0

    orientation_stddev: 0.0
